<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bandeja de ideas</title>
<meta name="theme-color" content="#14171c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#f4f2ee; --surface:#ffffff; --surface-2:#ebe8e2; --text:#1b1d21; --muted:#6b6f76;
    --line:#dedad3; --accent:#d9480f; --accent-ink:#ffffff; --danger:#c92a2a; --ok:#2b8a3e;
    --c-trabajo:#1c7ed6; --c-universidad:#7048e8; --c-personal:#e8590c; --c-proyectos:#0ca678; --c-otro:#868e96;
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14171c; --surface:#1d2128; --surface-2:#262b33; --text:#eceef1; --muted:#9aa1ab;
      --line:#30363f; --accent:#ff7a3d; --accent-ink:#14171c; --c-trabajo:#4dabf7; --c-universidad:#a78bfa; --c-personal:#ff922b; --c-proyectos:#20c997; --c-otro:#adb5bd;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14171c; --surface:#1d2128; --surface-2:#262b33; --text:#eceef1; --muted:#9aa1ab;
    --line:#30363f; --accent:#ff7a3d; --accent-ink:#14171c; --c-trabajo:#4dabf7; --c-universidad:#a78bfa; --c-personal:#ff922b; --c-proyectos:#20c997; --c-otro:#adb5bd;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--text);
    font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:env(safe-area-inset-top) 0 calc(112px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 16px}
  header{display:flex;align-items:center;gap:2px;padding:14px 0 6px}
  .encabezado{flex:1;min-width:0}
  #openApps{margin-left:-10px}
  h1{font-size:24px;margin:0;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:13px;margin-top:1px}
  .icon-btn{background:none;border:0;color:var(--text);width:44px;height:44px;border-radius:12px;display:grid;place-items:center;cursor:pointer}
  .icon-btn:active{background:var(--surface-2)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
  /* Barra de captura: fija abajo, al alcance del pulgar */
  .capture{
    position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);
    padding:10px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .capture-in{max-width:608px;margin:0 auto}
  .capture .hint{margin:0 0 8px 2px;display:none}
  .capture .hint.visible{display:block}
  .composer{display:flex;gap:8px;align-items:flex-end}
  textarea{
    flex:1;min-width:0;height:52px;max-height:132px;resize:none;border:1px solid var(--line);border-radius:26px;outline:none;
    background:var(--surface);color:var(--text);font:inherit;font-size:16px;padding:14px 18px;scrollbar-width:none;
  }
  textarea:focus{border-color:var(--muted)}
  textarea::placeholder{color:var(--muted)}
  .row{display:flex;gap:10px;align-items:center}
  .mic,.send{
    width:52px;height:52px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;flex:none;
  }
  .mic{background:var(--accent);color:var(--accent-ink)}
  .send{background:var(--text);color:var(--bg)}
  .send:disabled{display:none}
  .mic.rec{background:var(--danger);color:#fff;animation:pulse 1.2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,42,42,.5)}70%{box-shadow:0 0 0 16px rgba(201,42,42,0)}100%{box-shadow:0 0 0 0 rgba(201,42,42,0)}}
  .btn{
    border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;
    background:var(--surface-2);color:var(--text)
  }
  .btn.primary{background:var(--text);color:var(--bg)}
  .btn:disabled{opacity:.45}
  .hint{color:var(--muted);font-size:13px;min-height:18px}
  .search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;margin-top:6px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 10px;margin:0 -16px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:none;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;
    padding:7px 13px;font:inherit;font-size:14px;cursor:pointer
  }
  .chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
  /* Línea de tiempo: día > hora | riel con punto | contenido */
  .dia-titulo{
    position:sticky;top:0;z-index:2;background:var(--bg);margin:0 -16px;padding:12px 16px 6px;
    font-size:13px;font-weight:650;color:var(--muted);
  }
  .dia-titulo.hoy{color:var(--text)}
  .entrada{display:grid;grid-template-columns:44px 28px minmax(0,1fr);cursor:pointer}
  .hora{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;padding-top:2px;line-height:21px}
  .riel{position:relative}
  .riel::before{content:"";position:absolute;left:13px;top:0;bottom:0;width:2px;background:var(--line)}
  .entrada:first-child .riel::before{top:12px}
  .entrada:last-child .riel::before{bottom:auto;height:12px}
  .entrada:first-child:last-child .riel::before{display:none}
  .punto{
    position:absolute;left:-8px;top:-10px;width:44px;height:44px;padding:0;border:0;background:none;cursor:pointer;
    display:grid;place-items:center;color:var(--cat);
  }
  .punto i{
    display:grid;place-items:center;width:14px;height:14px;border-radius:50%;background:var(--cat);
    box-shadow:0 0 0 3px var(--bg);color:var(--bg);
  }
  .punto svg{display:none}
  .entrada.done .punto i{width:18px;height:18px}
  .entrada.done .punto svg{display:block}
  .contenido{padding:1px 0 18px 2px}
  .entrada:last-child .contenido{padding-bottom:8px}
  .title{font-weight:650;font-size:16px;margin:0 0 2px}
  .body{margin:0;color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere}
  .title + .body{color:var(--muted);font-size:14px}
  .resumen{margin:4px 0 0;color:var(--muted);font-size:14px}
  .entrada.done .title,.entrada.done .body{text-decoration:line-through;color:var(--muted)}
  .meta{display:flex;flex-wrap:wrap;gap:0 6px;align-items:center;font-size:13px;color:var(--muted);margin-top:3px}
  .meta .cat{color:var(--cat);font-weight:600}
  .meta span + span::before{content:"·";margin-right:6px;color:var(--muted);font-weight:400}
  .actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;cursor:default}
  .actions .btn{padding:9px 12px;font-size:14px;font-weight:500}
  select{font:inherit;font-size:14px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text)}
  .empty{text-align:center;color:var(--muted);padding:40px 10px}
  /* Aviso discreto: no compite con la línea de tiempo */
  .banner{display:block;width:100%;text-align:left;padding:9px 12px;margin:6px 0 0;font:inherit;font-size:13px;color:var(--muted);cursor:pointer}
  .banner[hidden]{display:none}
  .banner b{color:var(--text);font-weight:600}
  dialog{border:0;border-radius:20px;padding:0;width:min(560px,calc(100% - 32px));background:var(--surface);color:var(--text)}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  /* Panel lateral de aplicaciones */
  #cajon{
    margin:0;inset:0 auto 0 0;width:min(320px,85%);max-width:none;height:100%;max-height:none;
    border-radius:0 20px 20px 0;overflow:hidden;
  }
  #cajon[open]{display:flex;flex-direction:column;animation:cajon .2s ease-out}
  @keyframes cajon{from{transform:translateX(-100%)}to{transform:none}}
  @media (prefers-reduced-motion:reduce){#cajon[open]{animation:none}}
  .cajon-cab{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 8px 8px 20px}
  .cajon-cab h2{margin:0;font-size:19px;outline:none}
  .btn-texto{border:0;background:none;color:var(--accent);font:inherit;font-weight:600;padding:10px 12px;border-radius:10px;cursor:pointer;min-height:44px}
  .btn-texto:active{background:var(--surface-2)}
  #cajonBuscar{margin:4px 16px 8px;width:calc(100% - 32px);flex:none;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
  .cajon-lista{flex:1;overflow-y:auto;padding:0 0 16px}
  .app{
    display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:8px 20px;border:0;background:none;
    color:var(--text);font:inherit;text-align:left;cursor:pointer;
  }
  .app:active{background:var(--surface-2)}
  .app img{width:40px;height:40px;flex:none}
  .app span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .app input{width:22px;height:22px;flex:none;accent-color:var(--accent)}
  .cajon-vacio{color:var(--muted);font-size:14px;padding:16px 20px}
  .sheet{padding:20px}
  .sheet h2{margin:0 0 14px;font-size:19px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .field input,.field select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
  .small{font-size:13px;color:var(--muted)}
  .toast{
    position:fixed;z-index:6;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);opacity:0;pointer-events:none;
    background:var(--text);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;transition:opacity .2s;width:max-content;max-width:calc(100% - 32px)
  }
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){.mic.rec,.spin{animation:none}}
  .spin{display:inline-block;width:10px;height:10px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="icon-btn" id="openApps" aria-label="Abrir aplicaciones" aria-haspopup="dialog" hidden>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>
    <div class="encabezado">
      <h1>Bandeja</h1>
      <div class="sub" id="count">—</div>
    </div>
    <button class="icon-btn" id="toggleSearch" aria-label="Buscar en tus ideas" aria-expanded="false">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
    </button>
    <button class="icon-btn" id="openSettings" aria-label="Ajustes">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <button class="card banner" id="keyBanner" hidden>
    <b>Falta tu clave de Claude.</b> Las ideas se guardan igual, pero sin ordenar. Toca para agregarla.
  </button>

  <input class="search" id="search" type="search" placeholder="Buscar en tus ideas" hidden>
  <div class="chips" id="chips"></div>
  <div class="list" id="list"></div>
</div>

<section class="capture">
  <div class="capture-in">
    <div class="hint" id="hint" role="status">Toca el micrófono para dictar.</div>
    <div class="composer">
      <textarea id="input" rows="1" aria-label="Nueva idea" placeholder="¿Qué se te ocurrió?"></textarea>
      <button class="send" id="save" aria-label="Guardar idea" disabled>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="6 11 12 5 18 11"/></svg>
      </button>
      <button class="mic" id="mic" aria-label="Dictar idea">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
      </button>
    </div>
  </div>
</section>

<dialog id="cajon" aria-labelledby="cajonTitulo">
  <div class="cajon-cab">
    <h2 id="cajonTitulo" tabindex="-1" autofocus>Aplicaciones</h2>
    <button class="btn-texto" id="cajonEditar">Editar</button>
  </div>
  <input id="cajonBuscar" type="search" placeholder="Buscar aplicación" aria-label="Buscar aplicación" hidden>
  <div class="cajon-lista" id="cajonLista"></div>
</dialog>

<dialog id="settings">
  <form method="dialog" class="sheet">
    <h2 tabindex="-1" autofocus style="outline:none">Ajustes</h2>
    <div class="field">
      <label for="apiKey">Clave de la API de Claude</label>
      <input id="apiKey" type="password" autocomplete="off" placeholder="sk-ant-...">
      <div class="small" style="margin-top:6px">Se guarda solo en este teléfono.</div>
    </div>
    <div class="field">
      <label for="model">Modelo</label>
      <input id="model" type="text" autocomplete="off">
    </div>
    <div class="field">
      <label for="theme">Tema</label>
      <select id="theme">
        <option value="auto">Automático</option>
        <option value="light">Claro</option>
        <option value="dark">Oscuro</option>
      </select>
    </div>
    <div class="field">
      <label>Respaldo</label>
      <div class="row" style="flex-wrap:wrap">
        <button type="button" class="btn" id="exportBtn">Exportar</button>
        <button type="button" class="btn" id="importBtn">Importar</button>
        <button type="button" class="btn" id="retryBtn">Ordenar pendientes</button>
      </div>
      <input type="file" id="importFile" accept="application/json" hidden>
      <div class="small" style="margin-top:6px">Las ideas viven en este teléfono. Exporta de vez en cuando para no perderlas.</div>
    </div>
    <div class="field" id="jarvisBox" hidden>
      <label for="jarvisKey">“Oye Jarvis”</label>
      <input id="jarvisKey" type="password" autocomplete="off" placeholder="AccessKey de Picovoice">
      <div class="row" style="flex-wrap:wrap;margin-top:8px">
        <button type="button" class="btn" id="jarvisToggle">Activar</button>
        <button type="button" class="btn" id="jarvisPausa" hidden>Pausar</button>
        <button type="button" class="btn" id="jarvisEncima" hidden>Permitir abrir encima</button>
        <button type="button" class="btn" id="jarvisBateria" hidden>Batería sin restricciones</button>
      </div>
      <div class="row" id="jarvisSensBox" style="margin-top:8px;align-items:center" hidden>
        <label for="jarvisSens" style="margin:0">Sensibilidad</label>
        <select id="jarvisSens">
          <option value="alta">Alta (te escucha más fácil)</option>
          <option value="media">Media</option>
          <option value="baja">Baja (menos falsas alarmas)</option>
        </select>
      </div>
      <div id="jarvisOpciones" hidden>
        <div class="row" style="margin-top:8px;align-items:center">
          <label for="jarvisModo" style="margin:0">Al decir “Oye Jarvis”</label>
          <select id="jarvisModo">
            <option value="guardar">Guardar sin abrir la app</option>
            <option value="abrir">Abrir la app para dictar</option>
          </select>
        </div>
        <div class="row" style="margin-top:8px;align-items:center">
          <label for="jarvisRespuesta" style="margin:0">Confirmación</label>
          <select id="jarvisRespuesta">
            <option value="notificacion">Notificación y vibración</option>
            <option value="voz">Jarvis responde hablando</option>
          </select>
        </div>
      </div>
      <div class="small" id="jarvisInfo" style="margin-top:6px"></div>
    </div>
    <div class="field" id="esperaBox" hidden>
      <label for="espera">Espera al dictar</label>
      <select id="espera">
        <option value="2">2 segundos de silencio</option>
        <option value="3">3 segundos de silencio</option>
        <option value="5">5 segundos de silencio</option>
      </select>
      <div class="small" style="margin-top:6px">Cuánto espera callado antes de guardar. Para terminar antes, di “eso es todo” o toca el micrófono.</div>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:6px">
      <button class="btn" value="cancel">Cerrar</button>
      <button class="btn primary" id="saveSettings" value="ok">Guardar</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script>
(() => {
  const CATS = [
    {id:'trabajo', label:'Trabajo', color:'var(--c-trabajo)'},
    {id:'universidad', label:'Universidad', color:'var(--c-universidad)'},
    {id:'personal', label:'Personal', color:'var(--c-personal)'},
    {id:'proyectos', label:'Proyectos', color:'var(--c-proyectos)'},
    {id:'otro', label:'Otro', color:'var(--c-otro)'}
  ];
  const TIPOS = {idea:'Idea', tarea:'Tarea', recordatorio:'Recordatorio', nota:'Nota'};
  const DEFAULT_MODEL = 'claude-haiku-5-5';
  const STORE = 'bandeja.ideas.v1';
  const CONF = 'bandeja.config.v1';

  // ---------- almacenamiento ----------
  const load = (k, fallback) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch { return fallback; } };
  const persist = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { toast('No se pudo guardar en el teléfono'); return false; } };

  let ideas = load(STORE, []);
  let config = Object.assign({apiKey:'', model:DEFAULT_MODEL, theme:'auto'}, load(CONF, {}));
  let filter = 'todas';
  let query = '';
  const busy = new Set();

  const saveIdeas = () => persist(STORE, ideas);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  // ---------- elementos ----------
  const $ = id => document.getElementById(id);
  const input = $('input'), saveBtn = $('save'), micBtn = $('mic'), hint = $('hint');
  const listEl = $('list'), chipsEl = $('chips'), countEl = $('count');

  // ---------- tema ----------
  function applyTheme(){
    if (config.theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', config.theme);
  }

  // ---------- toast ----------
  let toastTimer;
  function toast(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  // ---------- clasificación con Claude ----------
  const SYSTEM = `Eres el asistente que ordena la bandeja de ideas de Juan Carlos. Él estudia Ingeniería Civil Industrial online, trabaja como operador de sorter en un centro logístico (turno de 00:00 a 09:00) y arma proyectos tecnológicos propios (scripts en Python, dashboards, automatizaciones).

Recibirás una idea dictada o escrita, a veces con errores de transcripción. Devuelve SOLO un objeto JSON, sin texto adicional ni bloques de código, con esta forma:
{"titulo": "...", "resumen": "...", "categoria": "...", "tipo": "...", "etiquetas": ["..."]}

Reglas:
- titulo: máximo 8 palabras, claro y concreto, en español.
- resumen: una oración que limpie la idea (corrige errores de dictado), sin inventar nada que no esté en el texto.
- categoria: una de "trabajo" (sorter, turno, logística del trabajo), "universidad" (ramos, pruebas, entregas, clases), "personal" (salud, gym, familia, compras, vida diaria), "proyectos" (apps, código, emprendimientos, automatizaciones) u "otro".
- tipo: "idea", "tarea" (algo que debe hacer), "recordatorio" (algo con fecha u hora) o "nota" (un dato para guardar).
- etiquetas: de 0 a 3 palabras clave cortas en minúscula.`;

  async function classify(idea){
    if (!config.apiKey || busy.has(idea.id) || !navigator.onLine) return;
    busy.add(idea.id); render();
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{
          'content-type':'application/json',
          'x-api-key':config.apiKey,
          'anthropic-version':'2023-06-01',
          'anthropic-dangerous-direct-browser-access':'true'
        },
        body: JSON.stringify({
          model: config.model || DEFAULT_MODEL,
          max_tokens: 400,
          system: SYSTEM,
          messages: [{role:'user', content: idea.texto}]
        })
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err?.error?.message || ('Error ' + res.status));
      }
      const data = await res.json();
      const raw = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
      const json = JSON.parse(raw.slice(raw.indexOf('{'), raw.lastIndexOf('}') + 1));
      const target = ideas.find(i => i.id === idea.id);
      if (target) {
        target.titulo = String(json.titulo || '').slice(0, 120);
        target.resumen = String(json.resumen || '');
        // Si la sección se dijo por voz ("guarda en trabajo…"), manda esa y no la que proponga Claude.
        if (!target.categoriaFija) target.categoria = CATS.some(c => c.id === json.categoria) ? json.categoria : 'otro';
        target.tipo = TIPOS[json.tipo] ? json.tipo : 'idea';
        target.etiquetas = Array.isArray(json.etiquetas) ? json.etiquetas.slice(0, 3).map(String) : [];
        target.clasificada = true;
        target.error = null;
        saveIdeas();
      }
    } catch (e) {
      const target = ideas.find(i => i.id === idea.id);
      if (target) { target.error = e.message; saveIdeas(); }
      toast('No se pudo ordenar: ' + e.message);
    } finally {
      busy.delete(idea.id); render();
    }
  }

  function classifyPending(){
    ideas.filter(i => !i.clasificada).forEach(i => classify(i));
  }

  // ---------- guardar idea ----------
  function addIdea(){
    const texto = input.value.trim();
    if (!texto) return;
    const idea = {id:uid(), texto, creada:new Date().toISOString(), categoria:'otro', tipo:'idea', etiquetas:[], hecha:false, clasificada:false};
    ideas.unshift(idea);
    saveIdeas();
    input.value = ''; updateSaveBtn();
    render();
    if (!config.apiKey) toast('Guardada. Se ordenará cuando agregues tu clave.');
    else if (!navigator.onLine) toast('Guardada sin conexión. Se ordenará al volver la señal.');
    else toast('Guardada');
    classify(idea);
  }

  // ---------- dictado por voz ----------
  // Dentro de la app Android, window.BandejaNativa da la voz del teléfono (el WebView no trae la del navegador).
  const NATIVA = window.BandejaNativa || null;
  const VOZ_NATIVA = !!(NATIVA && NATIVA.disponible());
  // Ideas que Jarvis guardó por voz con la app cerrada ("Oye Jarvis, guarda en trabajo…").
  function sincronizarNativas(){
    if (!NATIVA || !NATIVA.tomarIdeas) return;
    let nuevas = [], borrar = [];
    try { nuevas = JSON.parse(NATIVA.tomarIdeas() || '[]'); borrar = JSON.parse(NATIVA.tomarBorrados() || '[]'); } catch { return; }
    if (!nuevas.length && !borrar.length) return;
    const known = new Set(ideas.map(i => i.id));
    const agregadas = nuevas.filter(n => n && n.id && n.texto && !known.has(n.id)).map(n => ({
      id:n.id, texto:n.texto, creada:n.creada || new Date().toISOString(),
      categoria: CATS.some(c => c.id === n.categoria) ? n.categoria : 'otro', categoriaFija: !!n.categoria,
      tipo:'idea', etiquetas:[], hecha:false, clasificada:false, origen:'voz'
    }));
    ideas = [...agregadas, ...ideas.filter(i => !borrar.includes(i.id))].sort((a, b) => b.creada.localeCompare(a.creada));
    saveIdeas(); render();
    if (agregadas.length) toast(agregadas.length === 1 ? 'Llegó 1 idea dictada a Jarvis' : agregadas.length + ' ideas dictadas a Jarvis');
    agregadas.forEach(i => classify(i));
  }
  window.bandejaNuevasIdeas = sincronizarNativas;
  document.addEventListener('visibilitychange', () => { if (!document.hidden) sincronizarNativas(); });

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, recording = false, recError = false, baseText = '';
  // modoVoz: se abrió con "Dictar idea" o el botón lateral, así que guarda sola al terminar de hablar.
  let modoVoz = false;
  const VOZ_ERRORES = {
    'not-allowed':'Permite el micrófono para dictar.',
    'no-speech':'No escuché nada. Intenta de nuevo.',
    'network':'El dictado necesita conexión.'
  };
  if (!SR && !VOZ_NATIVA) {
    micBtn.disabled = true; micBtn.style.opacity = .4;
    hint.textContent = 'Este navegador no permite dictar. Usa Chrome.';
  }
  function endRec(){
    recording = false; micBtn.classList.remove('rec');
    if (!recError) hint.textContent = input.value.trim() ? 'Revisa y guarda.' : 'Toca el micrófono para dictar.';
    if (modoVoz && !recError && input.value.trim()) { addIdea(); hint.textContent = 'Idea guardada. Toca el micrófono para otra.'; }
    modoVoz = false;
  }
  window.bandejaVoz = (evento, texto) => {
    if (evento === 'listo') { recording = true; micBtn.classList.add('rec'); hint.textContent = 'Escuchando…'; return; }
    if (evento === 'parcial' || evento === 'final') {
      input.value = (baseText + texto).replace(/\s+/g, ' ');
      updateSaveBtn();
    }
    if (evento === 'error') { recError = true; hint.textContent = VOZ_ERRORES[texto] || ('Error de dictado: ' + texto); }
    if (evento === 'final' || evento === 'error') endRec();
  };
  function startRec(){
    if (VOZ_NATIVA) {
      baseText = input.value ? input.value.trim() + ' ' : '';
      recError = false;
      hint.textContent = 'Preparando micrófono…';
      NATIVA.iniciarVoz();
      return;
    }
    rec = new SR();
    rec.lang = 'es-CL';
    rec.continuous = true;
    rec.interimResults = true;
    baseText = input.value ? input.value.trim() + ' ' : '';
    rec.onresult = e => {
      let finalTxt = '', interim = '';
      for (let i = 0; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) finalTxt += r[0].transcript; else interim += r[0].transcript;
      }
      input.value = (baseText + finalTxt + interim).replace(/\s+/g, ' ');
      updateSaveBtn();
    };
    rec.onerror = e => {
      recError = true;
      hint.textContent = VOZ_ERRORES[e.error] || ('Error de dictado: ' + e.error);
    };
    rec.onend = endRec;
    recError = false;
    rec.start();
    recording = true; micBtn.classList.add('rec'); hint.textContent = 'Escuchando… toca de nuevo para terminar.';
  }
  function stopRec(){
    if (VOZ_NATIVA) NATIVA.detenerVoz();
    else if (rec) rec.stop();
  }
  micBtn.addEventListener('click', () => {
    if (!SR && !VOZ_NATIVA) return;
    if (recording) stopRec();
    else { try { startRec(); } catch (e) { hint.textContent = 'No se pudo iniciar el dictado.'; } }
  });
  window.bandejaIniciarVoz = () => {
    if (recording || (!SR && !VOZ_NATIVA)) return;
    modoVoz = true;
    try { startRec(); } catch (e) { modoVoz = false; hint.textContent = 'Toca el micrófono para dictar.'; }
  };

  // ---------- render ----------
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtHora = iso => new Date(iso).toLocaleTimeString('es-CL', {hour:'2-digit', minute:'2-digit', hourCycle:'h23'});
  function fmtDia(d){
    const now = new Date(), yest = new Date(now); yest.setDate(now.getDate() - 1);
    if (d.toDateString() === now.toDateString()) return 'Hoy';
    if (d.toDateString() === yest.toDateString()) return 'Ayer';
    const opts = {weekday:'long', day:'numeric', month:'long'};
    if (d.getFullYear() !== now.getFullYear()) opts.year = 'numeric';
    const t = d.toLocaleDateString('es-CL', opts);
    return t.charAt(0).toUpperCase() + t.slice(1);
  }
  let abierta = null; // la idea que muestra sus opciones

  function renderChips(){
    const opts = [{id:'todas', label:'Todas'}, ...CATS, {id:'hechas', label:'Hechas'}];
    chipsEl.innerHTML = opts.map(o => {
      const n = o.id === 'todas' ? ideas.filter(i => !i.hecha).length
              : o.id === 'hechas' ? ideas.filter(i => i.hecha).length
              : ideas.filter(i => !i.hecha && i.categoria === o.id).length;
      return `<button class="chip" data-f="${o.id}" aria-pressed="${filter === o.id}">${o.label}${n ? ' · ' + n : ''}</button>`;
    }).join('');
  }

  function render(){
    $('keyBanner').hidden = !!config.apiKey;
    const pend = ideas.filter(i => !i.hecha).length;
    countEl.textContent = pend === 1 ? '1 pendiente' : pend + ' pendientes';
    renderChips();

    const q = query.toLowerCase();
    const items = ideas.filter(i => {
      // En una línea de tiempo lo hecho sigue en su lugar, tachado; "Hechas" muestra solo eso.
      if (filter === 'hechas') { if (!i.hecha) return false; }
      else if (filter !== 'todas' && i.categoria !== filter) return false;
      if (!q) return true;
      return [i.texto, i.titulo, i.resumen, ...(i.etiquetas || [])].join(' ').toLowerCase().includes(q);
    });

    if (!items.length) {
      listEl.innerHTML = `<div class="empty">${ideas.length ? 'Nada por aquí.' : 'Aquí aparecerán tus ideas, de la más nueva a la más antigua. Dicta o escribe la primera abajo.'}</div>`;
      return;
    }

    // Agrupadas por día, de la más nueva a la más antigua.
    const dias = new Map();
    [...items].sort((a, b) => b.creada.localeCompare(a.creada)).forEach(i => {
      const k = new Date(i.creada).toDateString();
      if (!dias.has(k)) dias.set(k, []);
      dias.get(k).push(i);
    });
    const hoy = new Date().toDateString();
    listEl.innerHTML = [...dias].map(([k, grupo]) => `<section>
      <h2 class="dia-titulo ${k === hoy ? 'hoy' : ''}">${fmtDia(new Date(k))}</h2>
      <div>${grupo.map(entrada).join('')}</div>
    </section>`).join('');
  }

  function entrada(i){
    const cat = CATS.find(c => c.id === i.categoria) || CATS[4];
    const meta = [
      i.categoria !== 'otro' ? `<span class="cat">${cat.label}</span>` : '',
      i.tipo && i.tipo !== 'idea' ? `<span>${TIPOS[i.tipo]}</span>` : '',
      ...(i.etiquetas || []).map(t => `<span>#${esc(t)}</span>`),
      busy.has(i.id) ? '<span><span class="spin"></span> ordenando</span>'
        : !i.clasificada && config.apiKey ? '<span>sin ordenar</span>' : ''
    ].filter(Boolean).join('');
    const title = i.titulo ? `<p class="title">${esc(i.titulo)}</p>` : '';
    const resumen = i.resumen && i.resumen.trim() !== i.texto.trim() ? `<p class="resumen">${esc(i.resumen)}</p>` : '';
    const catOpts = CATS.map(c => `<option value="${c.id}" ${c.id === i.categoria ? 'selected' : ''}>${c.label}</option>`).join('');
    const abre = abierta === i.id;
    return `<article class="entrada ${i.hecha ? 'done' : ''}" data-id="${i.id}" style="--cat:${cat.color}">
      <time class="hora" datetime="${esc(i.creada)}">${fmtHora(i.creada)}</time>
      <div class="riel">
        <button class="punto" data-act="done" aria-label="${i.hecha ? 'Reabrir idea' : 'Marcar como hecha'}" aria-pressed="${!!i.hecha}">
          <i><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 13 10 18 19 7"/></svg></i>
        </button>
      </div>
      <div class="contenido">
        ${title}
        <p class="body">${esc(i.texto)}</p>
        ${resumen}
        ${meta ? `<div class="meta">${meta}</div>` : ''}
        ${abre ? `<div class="actions">
          <button class="btn" data-act="done">${i.hecha ? 'Reabrir' : 'Hecha'}</button>
          <select data-act="cat" aria-label="Sección">${catOpts}</select>
          ${!i.clasificada && config.apiKey ? '<button class="btn" data-act="retry">Ordenar</button>' : ''}
          <button class="btn" data-act="del" style="color:var(--danger);margin-left:auto">Borrar</button>
        </div>` : ''}
      </div>
    </article>`;
  }

  // ---------- eventos ----------
  function updateSaveBtn(){
    saveBtn.disabled = !input.value.trim();
    // El cuadro crece con el texto, hasta el máximo del CSS.
    input.style.height = 'auto';
    input.style.height = Math.max(52, input.scrollHeight + 2) + 'px';
  }
  input.addEventListener('input', updateSaveBtn);

  // El mensaje solo aparece cuando dice algo más que la instrucción inicial.
  const HINT_INICIAL = hint.textContent;
  new MutationObserver(() => hint.classList.toggle('visible', hint.textContent !== HINT_INICIAL))
    .observe(hint, {childList:true, characterData:true, subtree:true});

  $('keyBanner').addEventListener('click', () => $('openSettings').click());
  $('toggleSearch').addEventListener('click', e => {
    const s = $('search'), abrir = s.hidden;

  $('search').addEventListener('input', e => { query = e.target.value; render(); });

    const b = e.target.closest('[data-f]'); if (!b) return;

  });

    const b = e.target.closest('button[data-act]');

    if (b.dataset.act === 'retry') classify(idea);

      if (confirm('¿Borrar esta idea?')) { ideas = ideas.filter(i => i.id !== id); saveIdeas(); render(); toast('Borrada'); }
    }
  });
  listEl.addEventListener('change', e => {
    const s = e.target.closest('select[data-act="cat"]'); if (!s) return;
    const idea = ideas.find(i => i.id === s.closest('[data-id]').dataset.id); if (!idea) return;
    idea.categoria = s.value; saveIdeas(); render();
  });

  // ajustes
  const dlg = $('settings');
  $('openSettings').addEventListener('click', () => {
    $('apiKey').value = config.apiKey; $('model').value = config.model || DEFAULT_MODEL; $('theme').value = config.theme;
    dlg.showModal();
  });
  $('saveSettings').addEventListener('click', () => {
    config.apiKey = $('apiKey').value.trim();
    config.model = $('model').value.trim() || DEFAULT_MODEL;
    config.theme = $('theme').value;
    persist(CONF, config); applyTheme(); render();
    toast('Ajustes guardados');
    classifyPending();
  });
  $('exportBtn').addEventListener('click', () => {
    const json = JSON.stringify({exportada:new Date().toISOString(), ideas}, null, 2);
    const nombre = 'bandeja-ideas-' + new Date().toISOString().slice(0,10) + '.json';
    if (NATIVA) return NATIVA.guardarArchivo(nombre, json); // el WebView no descarga blobs

  $('importFile').addEventListener('change', async e => {

  });

  // "Oye Jarvis" (solo en la app Android): la escucha corre en el teléfono y la clave queda allá, no en la web.
  function renderJarvis(e){
    $('jarvisBox').hidden = false;
    $('jarvisKey').hidden = e.motor === 'oww'; // desde la v3 el detector no necesita clave
    $('jarvisKey').placeholder = e.tieneClave ? 'Clave guardada (escribe otra para cambiarla)' : 'AccessKey de Picovoice';
    $('jarvisToggle').textContent = e.activo ? 'Desactivar' : 'Activar';
    const conPausa = e.pausado !== undefined; // desde la v5 de la app
    $('jarvisPausa').hidden = !conPausa || !e.activo;
    $('jarvisPausa').textContent = e.pausado ? 'Reanudar' : 'Pausar';
    $('jarvisSensBox').hidden = !conPausa;
    if (e.sensibilidad) $('jarvisSens').value = e.sensibilidad;
    const conComandos = e.modo !== undefined; // desde la v7 de la app
    $('jarvisOpciones').hidden = !conComandos;

    $('jarvisEncima').hidden = !e.activo || e.encima;
    $('jarvisBateria').hidden = !e.activo || e.bateria;
    $('jarvisInfo').textContent =
        e.error ? 'No pude activar Jarvis: ' + e.error
      : e.activo && e.pausado ? 'En pausa: no usa el micrófono. También lo puedes pausar desde el botón “Jarvis” del panel de notificaciones.'
      : e.escuchando && !e.encima ? 'Escuchando. Permite “abrir encima” para que la app se abra sola al oírte.'
      : e.escuchando && e.modo === 'guardar' ? 'Escuchando. Di “Oye Jarvis”, espera la vibración y dicta: “guarda en trabajo revisar el sorter”, “pon una alarma a las 7 de la mañana”, “recuérdame mañana a las 10 llamar al banco”, “temporizador de 10 minutos” o “inicia el cronómetro”.'
      : e.escuchando ? 'Escuchando. Di “Oye Jarvis” en cualquier momento.'
      : e.activo ? 'Activando…'
      : e.motor === 'oww' ? 'Di “Oye Jarvis” y la app se abre lista para dictar. Todo se procesa en tu teléfono.'
      : 'Di “Oye Jarvis” y la app se abre lista para dictar. Necesita una AccessKey gratis de console.picovoice.ai.';
  }
  window.bandejaJarvis = renderJarvis;
  const jarvisEstado = () => JSON.parse(NATIVA.jarvisEstado());
  if (NATIVA && NATIVA.jarvisEstado) {
    $('openSettings').addEventListener('click', () => { $('jarvisKey').value = ''; renderJarvis(jarvisEstado()); });
    document.addEventListener('visibilitychange', () => { if (!document.hidden && dlg.open) renderJarvis(jarvisEstado()); });
    $('jarvisToggle').addEventListener('click', () => {
      const e = jarvisEstado(), clave = $('jarvisKey').value.trim();

    });

    $('jarvisModo').addEventListener('change', e => NATIVA.configurarJarvis('modo', e.target.value));
    $('jarvisRespuesta').addEventListener('change', e => NATIVA.configurarJarvis('respuesta', e.target.value));
    $('espera').addEventListener('change', e => { NATIVA.configurarJarvis('espera', e.target.value); toast('Espera: ' + e.target.value + ' s'); });
    $('jarvisSens').addEventListener('change', e => { NATIVA.sensibilidadJarvis(e.target.value); toast('Sensibilidad: ' + e.target.value); });
    $('jarvisEncima').addEventListener('click', () => NATIVA.abrirPermisoEncima());
    $('jarvisBateria').addEventListener('click', () => NATIVA.abrirBateria());
  }

  // ---------- panel de aplicaciones (solo en la app Android) ----------
  const cajon = $('cajon'), cajonLista = $('cajonLista');

    if (!iconos.has(p)) iconos.set(p, NATIVA.iconoApp(p));

  }
  // En Editar puede haber cien apps: cada ícono se pide recién cuando se ve.
  const iconosVisibles = 'IntersectionObserver' in window && new IntersectionObserver(entradas => entradas.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.src = icono(e.target.dataset.icono);
    iconosVisibles.unobserve(e.target);
  }), {root:cajonLista, rootMargin:'200px'});

  function misApps(){
    if (!Array.isArray(config.appsPanel)) { config.appsPanel = JSON.parse(NATIVA.appsSugeridas()); persist(CONF, config); }
    return config.appsPanel;
  }
  function renderCajon(){
    $('cajonEditar').textContent = editando ? 'Listo' : 'Editar';
    $('cajonBuscar').hidden = !editando;
    if (editando) {
      const q = $('cajonBuscar').value.trim().toLowerCase(), elegidas = misApps();
      const filas = instaladas.filter(a => a.nombre.toLowerCase().includes(q));
      cajonLista.innerHTML = filas.length ? filas.map(a => `<label class="app">
        <img alt="" data-icono="${esc(a.paquete)}"><span>${esc(a.nombre)}</span>
        <input type="checkbox" data-paquete="${esc(a.paquete)}" ${elegidas.includes(a.paquete) ? 'checked' : ''}>
      </label>`).join('') : '<p class="cajon-vacio">No encontré esa aplicación.</p>';
      cajonLista.querySelectorAll('img').forEach(img => iconosVisibles.observe(img));
      return;
    }
    // Las que se desinstalaron dejan de aparecer.
    const filas = misApps().map(p => instaladas.find(a => a.paquete === p)).filter(Boolean);
    cajonLista.innerHTML = filas.length ? filas.map(a => `<button class="app" data-paquete="${esc(a.paquete)}">
      <img alt="" src="${icono(a.paquete)}"><span>${esc(a.nombre)}</span>
    </button>`).join('') : '<p class="cajon-vacio">Toca Editar para elegir tus aplicaciones.</p>';
  }
  if (NATIVA && NATIVA.appsInstaladas) {
    $('openApps').hidden = false;
    $('openApps').addEventListener('click', () => {
      instaladas = JSON.parse(NATIVA.appsInstaladas());
      editando = false; $('cajonBuscar').value = '';
      renderCajon();
      cajon.showModal();
    });
    $('cajonEditar').addEventListener('click', () => { editando = !editando; $('cajonBuscar').value = ''; renderCajon(); cajonLista.scrollTop = 0; });
    $('cajonBuscar').addEventListener('input', renderCajon);
    cajonLista.addEventListener('change', e => {
      const c = e.target.closest('input[data-paquete]'); if (!c) return;
      const p = c.dataset.paquete;
      config.appsPanel = c.checked ? [...misApps(), p] : misApps().filter(x => x !== p);
      persist(CONF, config);
    });
    cajonLista.addEventListener('click', e => {
      const b = e.target.closest('button[data-paquete]'); if (!b) return;
      if (NATIVA.abrirApp(b.dataset.paquete)) cajon.close();
      else toast('No pude abrir esa aplicación');
    });
    // Tocar fuera del panel lo cierra.
    cajon.addEventListener('click', e => {
      if (e.target !== cajon) return;
      const r = cajon.getBoundingClientRect();
      if (e.clientX > r.right) cajon.close();
    });
  }
  // Botón Atrás del teléfono: cierra lo que esté abierto antes de salir.
  window.bandejaAtras = () => {
    const abierto = [cajon, dlg].find(d => d.open);
    if (abierto) abierto.close();
    return !!abierto;
  };

  window.addEventListener('online', classifyPending);

  // ---------- inicio ----------
  applyTheme();
  render();
  sincronizarNativas();
  classifyPending();
  if (new URLSearchParams(location.search).get('voz') === '1') {
    history.replaceState(null, '', location.pathname); // que recargar no vuelva a abrir el micrófono
    window.bandejaIniciarVoz();
  }

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
